<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 720px;
    background: #181614;
    font-family: Georgia, 'Times New Roman', serif;
    color: #ece5da;
    display: flex; align-items: center; justify-content: center;
  }
  .card { text-align: center; padding: 0 120px; }
  .topline {
    font-size: 17px; letter-spacing: 6px; text-transform: uppercase;
    color: #9a8f80; margin-bottom: 38px;
  }
  h1 { font-size: 84px; font-weight: normal; line-height: 1.12; margin-bottom: 34px; }
  .subtitle {
    font-size: 27px; font-style: italic; color: #c8bfb2; line-height: 1.45;
    margin-bottom: 48px;
  }
  .rule { width: 110px; border: none; border-top: 1px solid #6b6258; margin: 0 auto 30px; }
  .author { font-size: 23px; letter-spacing: 2px; color: #b9af9f; }
</style>
</head>
<body>
  <div class="card">
    <div class="topline">A framework for seeing clearly</div>
    <h1>The Wolf<br>Who Cried Boy</h1>
    <div class="subtitle">Why the most dangerous person in the room<br>is the one trying to help</div>
    <hr class="rule">
    <div class="author">LOGAN KING</div>
  </div>
</body>
</html>
