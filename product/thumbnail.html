<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 600px; height: 600px;
    background: #181614;
    font-family: Georgia, 'Times New Roman', serif;
    color: #ece5da;
    display: flex; align-items: center; justify-content: center;
  }
  .card { text-align: center; padding: 0 50px; }
  h1 { font-size: 64px; font-weight: normal; line-height: 1.15; margin-bottom: 28px; }
  .rule { width: 90px; border: none; border-top: 1px solid #6b6258; margin: 0 auto 24px; }
  .author { font-size: 20px; letter-spacing: 2px; color: #b9af9f; }
</style>
</head>
<body>
  <div class="card">
    <h1>The Wolf<br>Who<br>Cried Boy</h1>
    <hr class="rule">
    <div class="author">LOGAN KING</div>
  </div>
</body>
</html>
